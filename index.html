.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden}

.page{max-width:1180px;margin:0 auto;padding:18px 16px 40px}

.bookcard .bt{font-weight:800;font-size:1.05rem;padding-right:44px}
.bookcard .ba{font-size:.85rem;color:var(--muted)}
.bookcard .badge{position:absolute;top:12px;right:12px;font-size:2rem;line-height:1}
.bookcard .bm{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.bookcard .bm .meter{flex:1}
.bookcard .check{position:absolute;bottom:12px;right:12px;font-weight:800}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mode{border:0;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:104px}
.mode:hover,.bookcard:hover{transform:translateY(-1px)}
.mode .mi{font-size:1.9rem;line-height:1.1}
.mode .mt{font-weight:800;font-size:1.05rem}
.mode .md{font-size:.85rem;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.warnbar{background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:10px;font-weight:600}

/* ---------- game screens (must fit 1366x768 without scrolling) ---------- */
.game{height:calc(100dvh - var(--top));max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.gbar .pill{background:var(--panel);border-radius:999px;padding:6px 14px;box-shadow:var(--shadow);white-space:nowrap}
.gbar .grow{flex:1;min-width:80px}
.prompt{flex:0 0 auto;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 18px;border-left:8px solid var(--bk,var(--accent))}
.prompt .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.ptext{font-size:clamp(1.25rem,.9rem + 1.5vw,2.05rem);font-weight:700;margin:0;line-height:1.3}
.hint{margin:8px 0 0;background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:600}
.answer-area{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 16px;min-height:clamp(72px,14vh,112px);font-size:1.15rem;font-weight:600;box-shadow:var(--shadow)}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .k{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.choice .ct{display:flex;flex-direction:column}
.choice .ct small{font-weight:500}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.picked{border-color:var(--accent)}
.aux{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tform{display:flex;flex-direction:column;gap:10px}
.tform input{border:3px solid var(--line);border-radius:14px;padding:12px 16px;font-size:1.2rem;background:var(--panel);min-height:60px;width:100%}
.tform input:focus{outline:none;border-color:var(--accent)}
.tform .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tform .lbl{font-weight:700;font-size:.9rem;margin-bottom:4px;display:block}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;flex:0 0 auto}
.actions.center{justify-content:center}
.fb{border-radius:var(--r);padding:14px 18px;background:var(--panel);box-shadow:var(--shadow);border-left:8px solid var(--line);overflow:auto;min-height:0}
.fb.ok{border-left-color:var(--good)}
.fb.bad{border-left-color:var(--bad)}
.fb.part{border-left-color:var(--warn)}
.fb-head{font-size:1.35rem;font-weight:800;margin-bottom:6px}
.fb p{margin:6px 0}
.fb span.l{font-weight:800;color:var(--muted);margin-right:6px}
.olist{margin:4px 0 0;padding-left:22px}
.olist li{margin:2px 0}
.order{display:flex;flex-direction:column;gap:8px}
.oitem{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;min-height:52px;font-weight:600}
.oitem .n{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:800}
.oitem.set{border-color:var(--accent)}
.oitem.set .n{background:var(--accent);color:var(--accent-ink);border:0}
.selfbox{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;text-align:center}

/* flashcards */
.fcwrap{flex:1 1 auto;min-height:0;perspective:1400px}
.fc{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;outline:none}
.fc.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:22px 26px;display:flex;flex-direction:column;gap:10px;overflow:auto;border-top:10px solid var(--bk,var(--accent))}
.face.fc-back{transform:rotateY(180deg)}
.face .big{font-size:clamp(1.3rem,1.1rem + 1.2vw,2rem);font-weight:800;line-height:1.3}
.face .tap{margin-top:auto;color:var(--muted);font-weight:600}

/* mock battle */
.timer{position:relative;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.timer > i{position:absolute;inset:0 auto 0 0;background:var(--good);border-radius:99px}
.timer.urgent > i{background:var(--bad)}
.clock{font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:800;min-width:64px;text-align:right}
.clock.urgent{color:var(--bad)}
.steplbl{font-weight:800;font-size:1.05rem}
.results{overflow:auto;min-height:0;flex:1 1 auto;display:flex;flex-direction:column;gap:6px}
.rrow{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow)}
.rrow .pts{font-weight:800;min-width:56px}
.bigscore{font-size:clamp(2.2rem,1.5rem + 3vw,3.6rem);font-weight:900;line-height:1}
.endcard{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}

/* head to head */
.h2h{height:calc(100dvh - var(--top));padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:10px;overflow:hidden;position:relative;max-width:1400px;margin:0 auto}
.h2h .prompt{grid-column:1 / -1}
.pane{border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0;background:color-mix(in srgb,var(--pc) 12%,var(--bg));border:3px solid color-mix(in srgb,var(--pc) 45%,transparent)}
.pane.p0{--pc:#3d5afe}.pane.p1{--pc:#e8590c}
.pane.locked{opacity:.5}
.pane .ph{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:1.1rem}
.pane .ph .sc{font-size:1.6rem;background:var(--pc);color:#fff;border-radius:12px;padding:0 12px;min-width:48px;text-align:center}
.pane .choices{grid-template-columns:1fr;gap:8px;flex:1;align-content:stretch}
.pane .choice{min-height:52px;font-size:1rem}
.pane .keys{font-size:.75rem;color:var(--muted);text-align:center}
.reflist li.ri{display:flex;gap:12px;align-items:flex-start}
.reflist .re{flex:0 0 auto;width:2.2rem;height:2.2rem;display:grid;place-items:center;font-size:1.45rem;background:var(--panel);border-radius:10px;box-shadow:var(--shadow)}
.coop{grid-template-rows:auto auto 1fr}
.coop .bossbar,.coop .prompt{grid-column:1 / -1}
.bossbar{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 14px;flex-wrap:wrap}
.bossic{font-size:2.6rem;line-height:1;display:inline-block}
.bossinfo{flex:1;min-width:160px;display:flex;flex-direction:column;gap:3px}
.meter.hp{height:14px}.meter.hp > i{background:linear-gradient(90deg,#e03131,#f76707)}
.bossbar .pill{background:var(--panel2);border-radius:999px;padding:6px 12px;font-weight:700;white-space:nowrap}
.pane .role{font-size:.85rem;font-weight:800;background:var(--pc);color:#fff;border-radius:999px;padding:3px 10px}
.status{margin:8px 0 0;font-weight:700;color:var(--muted)}
.status.warn{color:var(--warn)}
.coop .choice .ct small{font-weight:600}
.ctypes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.ctypes > div{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:.92rem}
.ctypes b{display:block;font-size:1rem;margin-bottom:2px}
.prompt.center{text-align:center;border-left-width:0;border-top:6px solid var(--accent)}
.ptext.small{font-size:clamp(1.05rem,.9rem + .6vw,1.35rem)}
.flash{margin:6px 0 0;font-weight:800}
.flash.ok{color:var(--good)}.flash.bad{color:var(--bad)}
.kc{flex:0 0 auto;min-width:26px;height:26px;border-radius:7px;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.75rem;color:var(--muted)}
.choice.bin{border-color:var(--bk);border-left-width:12px;font-size:1.25rem;font-weight:800}
.choice.desc .ct{font-size:.9rem;font-weight:500;line-height:1.3}
.coop .pane .choices{grid-auto-rows:1fr}
.coop .pane{overflow:auto}
.coop .pane .choice{min-height:40px;padding:5px 10px}
.coop .pane .choices{gap:6px}
.coop.crossed .pane .choice{font-size:.98rem}
.coop.crossed .prompt.center{padding:6px 12px}
.waiting{flex:1;display:grid;place-items:center;font-weight:800;color:var(--muted);font-size:1.2rem}
.tl{list-style:none;margin:8px auto 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:100%}
.tl li{display:flex;gap:6px;align-items:center;background:var(--panel2);border:2px dashed var(--line);border-radius:10px;padding:4px 10px;font-size:.85rem;font-weight:600;max-width:32%;text-align:left}
.tl li.on{border:2px solid var(--good);background:var(--good-bg)}
.tl li span{font-weight:900;color:var(--muted)}
.readbox{background:var(--panel);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;border:2px solid var(--pc)}
.readbox b{font-size:1.02rem}
.fb.intro{max-width:640px;text-align:center}
.fb.intro p{font-size:1.05rem}
.timer.mini{flex:1;min-width:120px;height:12px}
@media (max-width:760px){.ctypes{grid-template-columns:1fr}.tl li{max-width:100%}}
.overlay{position:absolute;inset:0;background:rgba(10,14,24,.45);display:grid;place-items:center;padding:16px;z-index:3}
.overlay .fb{max-width:720px;width:100%;max-height:100%}

/* reference */
.reftabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.reftab{border:3px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:700;min-height:46px}
.reftab.on{border-color:var(--bk);background:color-mix(in srgb,var(--bk) 15%,var(--panel))}
.refhead{border-top:10px solid var(--bk)}
.refhead h1{font-size:1.7rem}
.refgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.refgrid .wide{grid-column:1 / -1}
.reflist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.reflist li{padding:8px 10px;border-radius:10px;background:var(--panel2)}
.reflist b{display:block}
.outline{counter-reset:o;list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:10px}
.outline li{background:var(--panel2);border-radius:12px;padding:10px 12px;border-left:5px solid var(--bk)}
.outline .sec{font-size:.8rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* trophies */
.ladder{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rung{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:12px;border:2px solid var(--line);min-width:74px;font-size:.72rem;text-align:center;filter:grayscale(1);opacity:.45}
.rung .ic{font-size:1.6rem}
.rung.got{filter:none;opacity:1;background:var(--panel2)}
.rung.cur{border-color:var(--bk);background:color-mix(in srgb,var(--bk) 15%,var(--panel))}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--panel2)}
.prow .av{font-size:2rem}
.prow.me{outline:3px solid var(--accent)}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avgrid label{display:grid;place-items:center;font-size:1.8rem;border:3px solid var(--line);border-radius:12px;height:56px;cursor:pointer}
.avgrid input{position:absolute;opacity:0;pointer-events:none}
.avgrid input:checked + span{outline:3px solid var(--accent);border-radius:8px}
.stat{background:var(--panel2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.4rem}

/* admin */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);min-height:42px}
.filters input{flex:1;min-width:180px}
.qrow{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);border-left:6px solid var(--bad)}
.qrow.vf{border-left-color:var(--good)}
.qrows{display:flex;flex-direction:column;gap:8px}
.vchk{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:700;min-width:58px;cursor:pointer}
.vchk input{width:26px;height:26px;accent-color:var(--good);cursor:pointer}
.qmain{flex:1;min-width:0}
.qmeta{font-size:.78rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bk);display:inline-block}
.qp{font-weight:600;margin:2px 0}
.qa{color:var(--good);font-weight:700;font-size:.92rem}
.qd{color:var(--muted);font-size:.85rem}
.sumbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* battle tabs + battle day */
.btabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.btab{flex:1 0 auto;min-width:150px;text-align:left;border:3px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 14px;display:flex;flex-direction:column;gap:1px;min-height:56px}
.btab b{font-size:1.05rem}.btab small{font-size:.78rem}
.btab.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.bookcard .bm.soon{color:var(--muted);font-weight:600}
.daycard{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:var(--r);padding:12px 18px;background:linear-gradient(100deg,#1f2a44,#3d2a6b);color:#fff;box-shadow:var(--shadow)}
.daycard .di{font-size:2.2rem}.daycard small{display:block;color:#cdd3ff}.daycard .go{margin-left:auto;font-size:1.6rem;font-weight:800}
.dayhero{display:flex;gap:18px;align-items:center;border-top:8px solid var(--accent)}
.dayhero .dayicon{font-size:3.4rem}.dayhero p{margin:6px 0 0;font-size:1.05rem}
.phases{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.phases.big{grid-template-columns:1fr 1fr .7fr}
.phase{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.phases.big .phase{background:var(--panel);box-shadow:var(--shadow);border:0}
.phase .ph-top{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.phase .ph-row{display:flex;gap:8px;flex-wrap:wrap}
.phase .ph-row span{background:var(--bg);border-radius:999px;padding:3px 10px;font-weight:600;font-size:.9rem}
.phase.total{align-items:center;justify-content:center;text-align:center;background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.daygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.daylist{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.dates{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.dates div{display:grid;grid-template-columns:170px 1fr;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 10px}
.warn5{background:var(--bad)!important;color:#fff}
.many .choices{grid-template-columns:repeat(3,1fr);gap:8px}
.many .choice{min-height:52px;font-size:1rem;padding:6px 10px}
/* flashcards, MAL-style */
.fcsum{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:8px 12px;margin-bottom:10px;flex-wrap:wrap}
.fcsum .btn{min-height:40px}
.fcctl{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-bottom:10px}
.fcctl .ctl i{display:block;font-style:normal;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fcctl .chip small{color:inherit;opacity:.65;font-weight:700;margin-left:2px}
.fcctl .chip:disabled{opacity:.4}
.fcctl .chip{min-height:34px;padding:3px 11px;font-size:.88rem}
.fcctl .chips{gap:6px}
.fcwrap2{perspective:1600px;margin-bottom:14px}
.fcard{position:relative;width:100%;height:clamp(230px,42vh,440px);transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.1,.2,1);cursor:pointer;outline:none}
.fcard.flip{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;box-shadow:var(--shadow);padding:22px 26px 12px;display:grid;grid-template-rows:1fr auto;gap:6px;overflow:hidden;background:var(--panel);border-top:8px solid var(--bk,var(--accent))}
.fface.ff-back{transform:rotateY(180deg);background:var(--nav);color:#eef1f7;border-top-color:var(--bk,#7b8cff)}
.fbody{min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;justify-content:safe center}
.fface .lbl{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-right:110px}
.fface.ff-back .lbl{color:#a5b4ff}
.fq{font-size:clamp(1.25rem,1rem + 1.1vw,1.9rem);font-weight:700;line-height:1.35}
.fa{font-size:clamp(1.2rem,1rem + .9vw,1.7rem);line-height:1.4}
.fa .fexp{font-size:1rem;font-weight:400;color:#c9d1e6;margin:10px 0 0}
.fface.ff-back .olist{font-size:1.05rem}
.cardfoot{display:flex;align-items:center;gap:12px;min-height:34px}
.cardfoot .tip{flex:1;font-size:.8rem;color:var(--muted)}
.fface.ff-back .tip{color:#9aa6c4}
.mastflag{position:absolute;top:18px;right:22px;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--good);border:2px solid var(--good);border-radius:999px;padding:3px 9px;background:var(--good-bg)}
.mastbtn{background:transparent;border:2px dashed #55618a;border-radius:999px;padding:9px 18px;font-weight:700;color:#c9d1e6;min-height:44px}
.mastbtn:hover{border-style:solid;border-color:#51cf66;color:#51cf66}
.mastbtn.on{border-style:solid;border-color:#51cf66;color:#51cf66;background:rgba(81,207,102,.14)}
.hintbtn{background:transparent;border:2px dashed var(--line);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--muted);margin-top:14px;min-height:42px}
.hinttext{margin-top:14px;background:var(--warn-bg);border-left:4px solid var(--warn);border-radius:0 10px 10px 0;padding:10px 14px;font-weight:600}
.fcnav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fcnav .btn{min-height:52px}
.deckdone{background:var(--nav);color:#eef1f7;border-radius:16px;padding:34px 26px;text-align:center}
.deckdone h3{font-size:1.6rem;margin:0 0 10px;color:#a5b4ff}
.deckdone p{max-width:46ch;margin:0 auto 18px;color:#c9d1e6}
.deckdone .btn{margin:4px}
.deckdone .party{font-size:3rem}
@media (max-width:760px){.fcctl,.phases,.phases.big{grid-template-columns:1fr}.dates div{grid-template-columns:1fr}.many .choices{grid-template-columns:1fr 1fr}}
/* avatars + players */

<body>
<div id="app"></div>

<div id="modal-root"></div>
<input type="file" id="filepick" accept=".json,application/json" class="hidden">
<script>
'use strict';
/* =====================================================================
   Battle of the Books study app — single file, offline, no build step.
   Content lives in the JSON block above; progress lives in localStorage.
   ===================================================================== */

// ---------- content ----------
const RAW = (() => { try { return JSON.parse(document.getElementById('bob-content').textContent); } catch (e) { alert('The content JSON block has an error: ' + e.message); return {books:[],battles:[],questions:[]}; } })();
const BOOKS = Object.fromEntries((RAW.books || []).map(b => [b.id, b]));
const BATTLES = (RAW.battles && RAW.battles.length) ? RAW.battles : [{id:'all', name:'All books', books:Object.keys(BOOKS)}];
const battleOfBook = id => { const cur = BATTLES.find(b => b.id === S.battleId); return cur && cur.books.includes(id) ? cur : (BATTLES.find(bt => bt.books.includes(id)) || BATTLES[0]); };
const DEFAULTS = {
  mockBattle:{phase1Rounds:5, phase1Seconds:30, pointsTitle:5, pointsAuthor:3, phase2Rounds:3, phase2Seconds:20, pointsPhase2:10},
  quiz:{defaultMode:'multiple_choice', questionsPerQuiz:10},
  leitner:{boxes:5, startBox:1},
  xp:{perCorrect:10, streakBonusEvery:3, streakBonus:5},
  coop:{hearts:5, bossHp:30},
  h2h:{questions:10},
  content:{onlyVerified:false, includeKidQuestions:true}
};
const DEFAULT_TIERS = [{at:0,label:'Reader',icon:'📘'},{at:.25,label:'Explorer',icon:'🧭'},{at:.5,label:'Expert',icon:'🎓'},{at:.75,label:'Champion',icon:'🏅'},{at:1,label:'Master',icon:'🏆'}];
// ---------- avatars: an emoji on a bold gradient badge, stored as {i, c} ----------
const AV_ICONS = ['🐉','🦈','🐺','🦅','🦂','🐍','🦖','🦍','🦁','🐊','🕷️','🐻‍❄️','🥷','🤖','👽','💀','👾','🧛','🧟','🦹','👹','🔥','⚡','🌪️','❄️','☄️','🗡️','🛡️','🏹','🚀','🛸','🏎️','🛹','🎮','🏀','⚽','🏈','🎸','😎','🤠'];
const AV_COLORS = {inferno:['#ff512f','#dd2476','Inferno'], lava:['#f12711','#f5af19','Lava'], toxic:['#a8e063','#11998e','Toxic'], neon:['#00f260','#0575e6','Neon'],
  ice:['#00c6ff','#0072ff','Ice'], galaxy:['#7f00ff','#e100ff','Galaxy'], ocean:['#1cb5e0','#000851','Deep Sea'], gold:['#f7971e','#ffd200','Gold'],
  shadow:['#5b5b5b','#0f0f0f','Shadow'], camo:['#4d7f3a','#2c3e1f','Camo']};
const toAv = a => (a && typeof a === 'object' && a.i) ? a : {i:(typeof a === 'string' && a) ? a : '😎', c:'inferno'};
function avHtml(a, size = 40) { a = toAv(a); const c = AV_COLORS[a.c] || AV_COLORS.inferno; return `<span class="avb" style="--s:${size}px;--a1:${c[0]};--a2:${c[1]}">${a.i}</span>`; }
const randAv = () => { const ks = Object.keys(AV_COLORS); return {i:AV_ICONS[Math.floor(Math.random() * AV_ICONS.length)], c:ks[Math.floor(Math.random() * ks.length)]}; };

/* ---------- the name (same as the MAL app) ----------
   The filter is a joke with a real link in it: a sixth grader who types something rude
   gets a straight face for a beat and then finds out. The word list is stored as hashes,
   so a list of swear words never ends up in the source. */
const hashStr = t => { let h = 2166136261; for (let i = 0; i < String(t).length; i++) { h ^= String(t).charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const RUDE=new Set([28231040,35318560,196557437,303976023,336914794,345001326,453580769,477198310,551573376,825071621,846393306,931162246,1356362998,1418208120,1456765026,1666915128,1698156692,1744782184,1780401646,1825958011,1905087418,1931933751,1998632844,2090526271,2150367198,2170560880,2185256537,2233071915,2269889212,2281838293,2283036957,2302528950,2374926977,2380100407,2444789715,2447652168,2460286864,2491417249,2505785029,2562532229,2597914442,2758825305,2761596009,2824268595,2985822365,3017570559,3070944574,3104482549,3114006918,3130294067,3478407156,3525777895,3527241627,3610473989,3646700319,3656079069,3666295138,3685727517,3866578250,4156838336,4249104160,4250961641]);
const rudeName = t => String(t).toLowerCase().replace(/[^a-z]+/g, ' ').split(' ').some(w => w && RUDE.has(hashStr(w)));
const TYPE_LABEL = {in_which_book:'In which book', detail:'Detail', character:'Character', sequence:'Sequence'};

// ---------- utils ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
const deepMerge = (a, b) => { const o = {...a}; for (const k in (b || {})) o[k] = isObj(b[k]) && isObj(a && a[k]) ? deepMerge(a[k], b[k]) : b[k]; return o; };
const today = () => new Date().toISOString().slice(0, 10);
const pct = x => Math.round(x * 100) + '%';

function norm(s) {
  return String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').replace(/\b(a|an|the)\b/g, ' ').replace(/\s+/g, ' ').trim();
}
function lev(a, b) {
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({length: b.length + 1}, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function fuzzyEq(input, cand) {
  const a = norm(input), b = norm(cand);
  if (!a || !b) return false;
  if (a === b || a.replace(/ /g, '') === b.replace(/ /g, '')) return true;
  const tol = b.length >= 10 ? 2 : b.length >= 5 ? 1 : 0;   // forgive small typos
  return lev(a, b) <= tol;
}

// ---------- storage ----------
const KEY = 'bob.v1';
let storageOK = true;
const mem = {};
function loadStore() { try { const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; } catch (e) { storageOK = false; return mem[KEY] ? JSON.parse(mem[KEY]) : null; } }
function save() { const t = JSON.stringify(S); try { localStorage.setItem(KEY, t); } catch (e) { storageOK = false; mem[KEY] = t; } }
function newProfile(name, avatar) { return {id:uid(), name, avatar:toAv(avatar), named:false, xp:0, streak:0, bestStreak:0, answered:0, correct:0, cards:{}, tiers:{}, mastered:{}, battleBest:null}; }
function freshStore() { return {version:2, profiles:[newProfile('', randAv())], teammates:[], battleId:BATTLES[0].id, selected:null, settings:{}, edits:{}, kidQs:[], coopWins:{}}; }
// v1 kept several players on one device; v2 is one player plus teammates, like the MAL app.
function migrate(s) {
  if (!s || !Array.isArray(s.profiles) || !s.profiles.length) return null;
  if (s.version === 1) {
    const me = s.profiles.find(p => p.id === s.activeId) || s.profiles[0];
    s.teammates = s.profiles.filter(p => p !== me).map(p => ({id:p.id, name:p.name, avatar:toAv(p.avatar)}));
    me.avatar = toAv(me.avatar); me.named = !/^Player \d+$/.test(me.name || '');
    s.profiles = [me]; delete s.activeId; s.version = 2;
  }
  return s.version === 2 ? s : null;
}
let S = migrate(loadStore()) || freshStore();
if (!BATTLES.find(b => b.id === S.battleId)) S.battleId = BATTLES[0].id;
S.teammates ||= []; S.edits ||= {}; S.kidQs ||= []; S.settings ||= {};

const settings = () => deepMerge(deepMerge(DEFAULTS, RAW.settings || {}), S.settings || {});
// ---------- players: one player per device (like the MAL app) + their teammates ----------
// Only this device's player keeps progress. Teammates are names + avatars saved on your
// profile so they can join Head-to-Head and the Co-op Boss Battle; their own progress lives
// on their own device. Guest is always available.
const profile = () => S.profiles[0];
const meName = () => profile().name || 'Player';
const profileById = id => id === profile().id ? profile() : null;
function playerInfo(id) {
  const p = profile();
  if (id === p.id) return {name:meName(), av:p.avatar};
  const t = (S.teammates || []).find(x => x.id === id);
  return t ? {name:t.name, av:t.avatar} : {name:'Guest', av:{i:'🙂', c:'shadow'}};
}
const validPlayer = id => id === 'guest' || id === profile().id || (S.teammates || []).some(t => t.id === id);
function playerEditor(kind, id) {
  const t = kind === 'me' ? profile() : (S.teammates || []).find(x => x.id === id);
  const first = kind === 'me' && !profile().named;
  const av = toAv(t ? t.avatar : randAv()); U.avDraft = {...av};
  const title = first ? 'What should the scoreboard call you?' : kind === 'me' ? 'Your profile' : t ? 'Edit teammate' : 'Add a teammate';
  const sub = first ? 'Pick a name and a look. They go at the top of the board.'
    : kind === 'tm' ? 'Teammates can join Head-to-Head and the Co-op Boss Battle. Their own progress is saved on their own device.' : '';
  return `<h2>${title}</h2>${sub ? `<p class="muted" style="margin-top:-6px">${sub}</p>` : ''}
    <form data-form="savePlayer" data-kind="${kind}" data-id="${kind === 'tm' && t ? t.id : ''}">
      <div class="avedit"><span id="avPreview">${avHtml(av, 86)}</span>
        <div class="field" style="flex:1;margin:0"><label for="pl-name">${kind === 'me' ? 'First name or nickname' : "Teammate's name"}</label>
          <input id="pl-name" name="name" maxlength="18" autocomplete="off" spellcheck="false" value="${t && t.name ? esc(t.name) : ''}" placeholder="First name or nickname" autofocus>
          <button type="button" class="ghost" data-act="avRandom" style="margin-top:8px">🎲 Random look</button></div></div>
      <div class="field"><label>Icon</label><div class="avicons">${AV_ICONS.map(i => `<button type="button" class="avpick ${i === av.i ? 'on' : ''}" data-act="avIcon" data-v="${i}">${i}</button>`).join('')}</div></div>
      <div class="field"><label>Colors</label><div class="avcolors">${Object.entries(AV_COLORS).map(([k, c]) => `<button type="button" class="avcol ${k === av.c ? 'on' : ''}" data-act="avColor" data-v="${k}" style="--a1:${c[0]};--a2:${c[1]}">${c[2]}</button>`).join('')}</div></div>
      <div id="nameWarn" class="hidden"></div>
      <div class="actions">${first ? '<button type="button" class="btn ghost" data-act="skipName">Skip</button>' : '<button type="button" class="btn" data-act="closeModal">Cancel</button>'}
        <button class="btn primary big">${first ? 'That’s me' : 'Save'}</button></div></form>`;
}
function paintAvDraft() {
  const pv = $('#avPreview'); if (pv) pv.innerHTML = avHtml(U.avDraft, 86);
  document.querySelectorAll('.avpick').forEach(b => b.classList.toggle('on', b.dataset.v === U.avDraft.i));
  document.querySelectorAll('.avcol').forEach(b => b.classList.toggle('on', b.dataset.v === U.avDraft.c));
}
function teamList() {
  const ts = S.teammates || [];
  return ts.length ? `<div class="plist">${ts.map(t => `<div class="prow">${avHtml(t.avatar, 44)}<b style="flex:1">${esc(t.name)}</b>
      <button class="btn small" data-act="tmEdit" data-id="${t.id}" aria-label="Edit">✎</button><button class="btn small" data-act="tmDel" data-id="${t.id}" aria-label="Remove">🗑</button></div>`).join('')}</div>`
    : '<p class="muted">No teammates yet. Add the friends you practice with.</p>';
}
// ---------- team: a name, 1-2 teammates (teams are 2 or 3 kids), and a badge ----------
// The badge defaults to a mix of the members' avatars on a gradient of their colors;
// the team can pick its own icon and colors instead.
const TEAM_ICONS = ['🛡️','⚔️','🏰','🐉','👑','🔥','⚡','🦁','🐺','🦅','🦈','🏆','📚','🗡️','🧙','🚀','💥','🌪️','☄️','🦂','🐍','🦖','💀','🥷','🤖','👾','🎯','🧠','📖','🪄'];
function team() {
  const t = S.team || (S.team = {name:'', icon:null, members:[]});
  t.members = (t.members || []).filter(id => (S.teammates || []).some(m => m.id === id)).slice(0, 2);
  return t;
}
const hasTeam = () => !!(team().name && team().members.length);
function teamBadge(size = 40, t = team()) {
  if (t.icon) return avHtml(t.icon, size);
  const avs = [profile().avatar, ...(t.members || []).map(id => playerInfo(id).av)].map(toAv);
  const cols = avs.map(a => AV_COLORS[a.c] || AV_COLORS.inferno);
  const bg = avs.length > 1 ? cols.map(c => c[0]).join(',') : `${cols[0][0]},${cols[0][1]}`;
  return `<span class="avb tb n${avs.length}" style="--s:${size}px;background:linear-gradient(135deg,${bg})">${avs.map(a => `<i>${a.i}</i>`).join('')}</span>`;

const teamLabel = (size = 26) => hasTeam() ? `<span class="pn">${teamBadge(size)} ${esc(team().name)}</span>` : '';
function teamEditor() { const t = team(); U.teamDraft = {name:t.name, icon:t.icon ? {...t.icon} : null, members:[...t.members]}; return teamEditorHtml(); }
function teamEditorHtml() {
  const d = U.teamDraft, first = !S.teamAsked;
  return `<h2>${first ? 'Now set up your team' : 'Your team'}</h2>
    <p class="muted" style="margin-top:-6px">Battle of the Books teams have 2 or 3 kids. Your team name and badge show up in the top bar, Mock Battles, and the Co-op Boss Battle.</p>
    <form data-form="saveTeam">
      <div class="avedit"><span id="tbPreview">${teamBadge(86, d)}</span>
        <div class="field" style="flex:1;margin:0"><label for="tm-name">Team name</label>
          <input id="tm-name" name="name" maxlength="24" value="${esc(d.name)}" placeholder="e.g. The Page Turners" autocomplete="off" spellcheck="false" autofocus></div></div>
      <div class="field"><label>Teammates (pick 1 or 2)</label><div class="tmpick">
        <span class="tmchip me">${avHtml(profile().avatar, 30)} ${esc(meName())} (you)</span>
        ${(S.teammates || []).map(m => `<button type="button" class="tmchip ${d.members.includes(m.id) ? 'on' : ''}" data-act="teamMember" data-id="${m.id}">${avHtml(m.avatar, 30)} ${esc(m.name)}${d.members.includes(m.id) ? ' ✓' : ''}</button>`).join('')}
        <button type="button" class="ghost" data-act="tmEdit">+ Add a teammate</button></div></div>
      <div class="field"><label>Team badge</label><div class="chips">
        <button type="button" class="chip ${d.icon ? '' : 'on'}" data-act="teamAuto">✨ Mix of our avatars</button>
        <button type="button" class="chip ${d.icon ? 'on' : ''}" data-act="teamCustom">🎨 Pick our own badge</button></div></div>
      ${d.icon ? `<div class="field"><div class="avicons team">${TEAM_ICONS.map(i => `<button type="button" class="avpick ${i === d.icon.i ? 'on' : ''}" data-act="teamIcon" data-v="${i}">${i}</button>`).join('')}</div></div>
        <div class="field"><div class="avcolors">${Object.entries(AV_COLORS).map(([k, c]) => `<button type="button" class="avcol ${k === d.icon.c ? 'on' : ''}" data-act="teamColor" data-v="${k}" style="--a1:${c[0]};--a2:${c[1]}">${c[2]}</button>`).join('')}</div></div>` : ''}

// ---------- questions ----------
const RAW_BY_ID = Object.fromEntries((RAW.questions || []).map(q => [q.id, q]));
function allQuestions() {
  const st = settings();
  const bank = (RAW.questions || []).map(q => ({...q, ...(S.edits[q.id] || {}), origin:'bank'}));
  const kids = st.content.includeKidQuestions ? S.kidQs.map(q => ({...q, origin:'kid'})) : [];
  return bank.concat(kids).filter(q => BOOKS[q.book]);
}
function playable(bookIds, pred) {
  const only = settings().content.onlyVerified;
  return allQuestions().filter(q => bookIds.includes(q.book) && (!only || q.verified) && (!pred || pred(q)));
}
const bookLabel = id => BOOKS[id] ? `${BOOKS[id].title} — ${BOOKS[id].author}` : id;
const isOrder = q => Array.isArray(q.order) && q.order.length > 1;
function candidates(q) {
  const c = [q.answer, ...(q.acceptAlso || [])];
  const stripped = String(q.answer || '').replace(/\s*\(.*?\)\s*/g, ' ').trim();
  if (stripped && stripped !== q.answer) c.push(stripped);
  return c.filter(Boolean);
}
const typeable = q => Math.min(...candidates(q).map(c => norm(c).split(' ').length)) <= 4;
function mcChoices(q) {
  if (q.type === 'in_which_book') {
    const others = shuffle(battleOfBook(q.book).books.filter(b => b !== q.book && BOOKS[b])).slice(0, 3);
    return shuffle([q.book, ...others]).map(id => ({text:BOOKS[id].title, sub:BOOKS[id].author, correct:id === q.book}));
  }
  const d = (q.distractors || []).filter(x => x && String(x).trim()).slice(0, 3);
  if (!d.length) return null;
  return shuffle([{text:q.answer, correct:true}, ...d.map(t => ({text:t, correct:false}))]);
}
const mcAble = q => q.type === 'in_which_book' || ((q.distractors || []).filter(Boolean).length >= 1);
function kindFor(q, mode) {
  if (q.type === 'in_which_book') return mode === 'type' ? 'iwb-type' : 'iwb-mc';
  if (isOrder(q)) return (mode === 'mc' && mcAble(q)) ? 'mc' : 'order';
  if (mode === 'mc') return mcAble(q) ? 'mc' : 'self';
  return typeable(q) ? 'type' : 'self';
}
const matchTitle = (bookId, s) => { const b = BOOKS[bookId]; return [b.title, ...(b.titleAccept || [])].some(c => fuzzyEq(s, c)); };
const matchAuthor = (bookId, s) => { const b = BOOKS[bookId]; return [b.author, ...(b.authorAccept || [])].some(c => fuzzyEq(s, c)); };

// weighted pick: lower Leitner box (= less known) and unseen questions come up more often
function pick(pool, n, p) {
  const W = {1:8, 2:5, 3:3, 4:2, 5:1};
  return pool.map(q => { const c = p && p.cards[q.id]; const w = c ? (W[c.b] || 1) : 6; return {q, k:Math.pow(Math.random(), 1 / w)}; })
    .sort((a, b) => b.k - a.k).slice(0, n).map(x => x.q);
}

// ---------- progress / gamification ----------
const tiersOf = b => (b.badge && b.badge.tiers && b.badge.tiers.length) ? b.badge.tiers : DEFAULT_TIERS;
function mastery(p, bookId) {
  const qs = playable([bookId]); if (!p || !qs.length) return 0;
  const max = settings().leitner.boxes; let s = 0;
  for (const q of qs) { const c = p.cards[q.id]; if (c) s += (c.b - 1) / (max - 1); }
  return s / qs.length;
}
function tierIndex(b, m) { let i = 0; tiersOf(b).forEach((t, k) => { if (m >= t.at - 1e-9) i = k; }); return i; }
const level = p => Math.floor(p.xp / 100) + 1;
function record(p, q, correct, opt = {}) {
  if (!p) return 0;
  const st = settings(), max = st.leitner.boxes;
  const c = p.cards[q.id] || {b:st.leitner.startBox || 1, n:0, c:0, w:0};
  c.n++; c.t = Date.now();
  let gain = 0;
  if (correct) {
    c.c++; c.b = Math.min(max, c.b + 1); p.streak++; p.correct++;
    gain = st.xp.perCorrect;
    if (opt.hint) gain = Math.ceil(gain / 2);
    if (opt.scale) gain = Math.ceil(gain * opt.scale);
    if (st.xp.streakBonusEvery && p.streak % st.xp.streakBonusEvery === 0) gain += st.xp.streakBonus;
    if ([5, 10, 20, 30, 50].includes(p.streak)) toast(`🔥 ${esc(p.name || 'You')} is on a ${p.streak}-answer streak!`, 'win');
  } else { c.w++; c.b = 1; p.streak = 0; if (p.mastered && p.mastered[q.id]) delete p.mastered[q.id]; }
  const lvl = level(p);
  p.answered++; p.bestStreak = Math.max(p.bestStreak, p.streak); p.xp += gain; p.cards[q.id] = c;
  if (level(p) > lvl) toast(`⭐ ${esc(p.name || 'You')} reached level ${level(p)}!`, 'win');
  const b = BOOKS[q.book];
  if (b) {
    const i = tierIndex(b, mastery(p, q.book)), prev = p.tiers[q.book] ?? 0;
    if (i > prev) { const t = tiersOf(b)[i]; toast(`${t.icon} ${esc(p.name || 'You')} earned <b>${esc(t.label)}</b> for ${esc(b.title)}!`, 'win'); }
    p.tiers[q.book] = Math.max(prev, i);
  }
  save();
  return gain;
}

// ---------- co-op: boss battle ----------
// Every round is a different challenge that one player can't beat alone:
//   Book Sort (split ownership), Match-Up (split halves), Timeline (split cards), Crossed Wires (split information).
// Right moves damage the boss; every mistake costs a shared heart; a perfect round is a critical hit.
const DEFAULT_BOSS = {name:'The Book Monster', icon:'👾'};
const COOP_LEVELS = {
  easy:{label:'🙂 Warm-up', hp:.7, hearts:1, time:1.5, pairs:4, clues:6},
  normal:{label:'😎 Challenge', hp:1, hearts:0, time:1, pairs:4, clues:7},
  hard:{label:'🔥 Legendary', hp:1.35, hearts:-1, time:.75, pairs:5, clues:8},
};
const COOP_TYPES = {
  sort:{icon:'🗂️', title:'Book Sort'}, match:{icon:'🧩', title:'Match-Up'},
  timeline:{icon:'🕰️', title:'Timeline'}, crossed:{icon:'📡', title:'Crossed Wires'},
};
const COOP_KEYS = ['asdfg', 'hjkl;'];
const heartsHtml = (n, max) => '❤️'.repeat(Math.max(0, n)) + '🤍'.repeat(Math.max(0, max - n));
const coopPool = () => playable(selectedBooks(), q => !isOrder(q) && mcAble(q));
const coopLevel = () => COOP_LEVELS[U.coop.level] || COOP_LEVELS.normal;
const pfirst = pname;
function factItems(id) {
  const f = BOOKS[id].factSheet || {}, out = [];
  [['characters', 'Character'], ['settings', 'Place'], ['keyObjects', 'Object']].forEach(([k, kind]) =>
    (f[k] || []).forEach(x => out.push({id:`${id}:${kind}:${x.name}`, name:x.name, desc:x.desc, emoji:x.emoji || '', kind, book:id})));
  return out;
}
const bigWords = (s, min = 4) => norm(s).split(' ').filter(w => w.length >= min);
const mentions = (text, words) => { const t = ` ${norm(text)} `; return words.some(w => t.includes(` ${w} `)); };

// ----- challenge builders (return null if the selected books can't support that challenge) -----
function buildSort(C) {
  const books = shuffle(selectedBooks()); if (books.length < 2) return null;
  const half = Math.ceil(books.length / 2), own = [books.slice(0, half), books.slice(half)];
  const pool = [];
  books.forEach(id => {
    const tw = bigWords(BOOKS[id].title);
    factItems(id).forEach(it => { if (!mentions(it.name, tw)) pool.push({key:it.id, text:it.name, tag:`${it.emoji} ${it.kind}`, book:id}); });
    playable([id], q => q.type === 'in_which_book').forEach(q => pool.push({key:q.id, text:q.prompt, tag:'📚 Clue', book:id, q}));
  });
  const fresh = pool.filter(x => !C.used.has(x.key)), src = fresh.length >= 12 ? fresh : pool, n = coopLevel().clues;
  let items = [];
  for (let t = 0; t < 25; t++) { items = shuffle(src).slice(0, n); const a = items.filter(x => own[0].includes(x.book)).length; if (a >= 2 && n - a >= 2) break; }
  items.forEach(x => C.used.add(x.key));
  return {type:'sort', own, items, k:0, per:Math.round(10000 * coopLevel().time), results:[]};
}
function buildMatch(C) {
  const books = shuffle(selectedBooks()).slice(0, 2), n = coopLevel().pairs;
  let pool = books.flatMap(factItems).filter(it => !mentions(it.desc, bigWords(it.name, 3)));   // description must not name the answer
  const fresh = pool.filter(x => !C.used.has('m:' + x.id)); if (fresh.length >= n) pool = fresh;
  if (pool.length < n) return null;
  let items = [];
  if (books.length === 2) {   // mix both books evenly so "which book" isn't a shortcut
    const a = shuffle(pool.filter(x => x.book === books[0])), b = shuffle(pool.filter(x => x.book === books[1]));
    for (let i = 0; items.length < n && (i < a.length || i < b.length); i++) { if (a[i]) items.push(a[i]); if (items.length < n && b[i]) items.push(b[i]); }
  } else items = shuffle(pool).slice(0, n);
  items.forEach(x => C.used.add('m:' + x.id));
  return {type:'match', books, left:shuffle(items), right:shuffle(items), sel:[null, null], matched:[], tries:[], total:Math.round(n * 14000 * coopLevel().time)};
}
function buildTimeline(C) {
  const srcs = [];
  selectedBooks().forEach(id => {
    const o = (BOOKS[id].factSheet || {}).outline || [];
    if (o.length >= 4) srcs.push({key:'t:' + id, title:`Put the parts of ${BOOKS[id].title} in the order they come in the book`, events:o.map(x => x.title), book:id});
  });
  playable(selectedBooks(), isOrder).forEach(q => srcs.push({key:q.id, title:`${BOOKS[q.book].title}: ${q.prompt}`, events:q.order, book:q.book, q}));
  if (!srcs.length) return null;
  const fresh = srcs.filter(s => !C.used.has(s.key)), s = shuffle(fresh.length ? fresh : srcs)[0];
  C.used.add(s.key);
  const hands = [[], []];
  shuffle(s.events.map((t, i) => ({t, i}))).forEach((c, k) => hands[k % 2].push(c));
  return {type:'timeline', src:s, hands, next:0, total:Math.round(s.events.length * 10000 * coopLevel().time)};
}
function buildCrossed(C) {
  let pool = coopPool().filter(q => !C.used.has(q.id));
  if (pool.length < 2) pool = coopPool(); if (pool.length < 2) return null;
  const harder = pool.filter(q => (q.difficulty || 2) >= 2); if (harder.length >= 2) pool = harder;
  const qs = pick(pool, 2, null); qs.forEach(q => C.used.add(q.id));
  return {type:'crossed', qs, choices:qs.map(mcChoices), ans:[null, null], total:Math.round(40000 * coopLevel().time)};
}
const BUILDERS = {sort:buildSort, match:buildMatch, timeline:buildTimeline, crossed:buildCrossed};
function nextChallenge(C) {
  for (let t = 0; t < 10; t++) {
    if (!C.queue.length) C.queue = shuffle(Object.keys(BUILDERS).filter(k => k !== C.lastType));
    const type = C.queue.shift(), ch = BUILDERS[type](C);
    if (ch) { Object.assign(ch, {hits:0, mistakes:0, bonus:0, timedOut:false, flash:null}); C.lastType = type; C.round++; C.history.push(ch); return ch; }
  }
  return null;
}

// ----- game loop -----
function coopBegin() {
  const C = U.coop, ch = C.ch; C.phase = 'play'; C.fx = null;
  if (ch.type === 'sort') ch.clueEnd = Date.now() + ch.per; else ch.end = Date.now() + ch.total;
  render(); TIMERS.push(setInterval(coopTick, 100)); coopTick();
}
function coopTick() {
  const C = U.coop; if (!C || C.phase !== 'play') return;
  const ch = C.ch, sort = ch.type === 'sort', total = sort ? ch.per : ch.total, left = Math.max(0, (sort ? ch.clueEnd : ch.end) - Date.now());
  const t = $('#co-time'), bar = $('#co-bar');
  if (t) { t.textContent = Math.ceil(left / 1000) + 's'; t.classList.toggle('urgent', left <= 4000); }
  if (bar) { bar.firstElementChild.style.width = (left / total * 100) + '%'; bar.classList.toggle('urgent', left <= 4000); }
  if (left > 0) return;
  if (sort) return sortAnswer(null);
  ch.timedOut = true;
  if (ch.type === 'crossed') ch.ans.forEach(a => { if (a == null && C.phase === 'play') coopMiss(); });
  else coopMiss();
  coopFinish();
}
function coopHit() { const C = U.coop; C.hp = Math.max(0, C.hp - 1); C.ch.hits++; C.stats.hits++; C.fx = 'hit'; if (C.hp <= 0) coopFinish(); }
function coopMiss() { const C = U.coop; C.hearts = Math.max(0, C.hearts - 1); C.ch.mistakes++; C.stats.mistakes++; C.fx = 'miss'; if (C.hearts <= 0) coopFinish(); }
function coopFinish() {
  const C = U.coop; if (C.phase !== 'play') return;
  stopTimers();
  const ch = C.ch;
  if (!ch.mistakes && !ch.timedOut && C.hp > 0 && C.hearts > 0) { ch.bonus = 2; C.hp = Math.max(0, C.hp - 2); C.stats.perfect++; }
  C.phase = 'result'; render();
}
function coopEnd(win) {
  stopTimers(); const C = U.coop; C.phase = 'end'; C.win = win;
  if (win) { S.coopWins ||= {}; S.coopWins[C.level] = (S.coopWins[C.level] || 0) + 1; save(); }
  render();
}
function sortAnswer(pickedBook) {
  const C = U.coop, ch = C.ch, clue = ch.items[ch.k], ok = pickedBook === clue.book, title = BOOKS[clue.book].title;
  ch.results.push({clue, picked:pickedBook, ok});
  if (clue.q) record(profileById(C.players[ch.own[0].includes(clue.book) ? 0 : 1]), clue.q, ok);
  ch.flash = ok ? {ok, text:`✅ ${title}!`} : {ok, text:pickedBook ? `❌ Not ${BOOKS[pickedBook].title}. That one was ${title}.` : `⏰ Too slow! That one was ${title}.`};
  ch.k++;
  if (ok) coopHit(); else coopMiss();
  if (C.phase !== 'play') return;
  if (ch.k >= ch.items.length) return coopFinish();
  ch.clueEnd = Date.now() + ch.per; render();
}
function coopTap(side, i) {
  const C = U.coop; if (!C || C.phase !== 'play') return;
  const ch = C.ch;
  if (ch.type === 'sort') { const b = ch.own[side][i]; if (b) sortAnswer(b); return; }
  if (ch.type === 'match') {
    const it = (side ? ch.right : ch.left)[i]; if (!it || ch.matched.includes(it.id)) return;
    ch.sel[side] = ch.sel[side] === i ? null : i;
    const [a, b] = ch.sel;
    if (a != null && b != null) {
      const L = ch.left[a], R = ch.right[b]; ch.sel = [null, null];
      if (L.id === R.id) { ch.matched.push(L.id); ch.flash = {ok:true, text:`✅ ${L.name}: matched!`}; coopHit(); if (C.phase === 'play' && ch.matched.length === ch.left.length) return coopFinish(); }
      else { ch.tries.push({name:L.name, desc:R.desc}); ch.flash = {ok:false, text:`❌ That description isn't ${L.name}.`}; coopMiss(); }
    }
  } else if (ch.type === 'timeline') {
    const card = ch.hands[side][i]; if (!card || card.used) return;
    if (card.i === ch.next) { card.used = true; ch.next++; ch.flash = {ok:true, text:`✅ Step ${ch.next} placed`}; coopHit(); if (C.phase === 'play' && ch.next === ch.src.events.length) return coopFinish(); }
    else { ch.flash = {ok:false, text:`❌ “${card.t}” isn't next`}; coopMiss(); }

    const qi = 1 - side; if (ch.ans[qi] != null) return;   // your buttons answer your TEAMMATE's question
    ch.ans[qi] = i; const ok = ch.choices[qi][i].correct;
    record(profileById(C.players[side]), ch.qs[qi], ok);
    ch.flash = {ok, text:ok ? '✅ Teamwork!' : '❌ Wrong answer'};
    if (ok) coopHit(); else coopMiss();
    if (C.phase === 'play' && ch.ans.every(a => a != null)) return coopFinish();
  }
  if (C.phase === 'play') render();
}

function coopButtons(items, side) {
  return `<div class="choices">${items.map((c, i) => `<button class="choice ${c.state || ''}" data-act="coopTap" data-p="${side}" data-i="${i}" ${c.disabled ? 'disabled' : ''} ${c.color ? `style="--bk:${esc(c.color)}"` : ''}>
    <span class="kc">${COOP_KEYS[side][i] ? COOP_KEYS[side][i].toUpperCase() : ''}</span><span class="ct">${c.html || esc(c.text)}${c.sub ? `<small>${esc(c.sub)}</small>` : ''}</span></button>`).join('')}</div>`;
}
function reviewRows(ch, onlyMissed) {
  const row = (ok, html) => `<div class="rrow"><span>${ok ? '✅' : '❌'}</span><div>${html}</div></div>`;
  if (ch.type === 'sort') return ch.results.filter(r => !onlyMissed || !r.ok).map(r => row(r.ok, `${esc(r.clue.text)} <span class="qa">→ ${esc(BOOKS[r.clue.book].title)}</span>`));
  if (ch.type === 'match') return ch.left.filter(it => !onlyMissed || !ch.matched.includes(it.id)).map(it => row(ch.matched.includes(it.id), `${it.emoji} <b>${esc(it.name)}</b> <small>(${esc(BOOKS[it.book].title)})</small><div class="qd">${esc(it.desc)}</div>`));
  if (ch.type === 'timeline') return (!onlyMissed || ch.mistakes || ch.timedOut) ? [row(!ch.mistakes && !ch.timedOut, `<b>${esc(ch.src.title)}</b><ol class="olist">${ch.src.events.map(e => `<li>${esc(e)}</li>`).join('')}</ol>`)] : [];
  return ch.qs.map((q, qi) => { const a = ch.ans[qi], ok = a != null && ch.choices[qi][a].correct; return (!onlyMissed || !ok) ? row(ok, `${esc(q.prompt)}<div class="qa">${answerHtml(q)}</div>${q.explanation ? `<div class="qd">${esc(q.explanation)}</div>` : ''}`) : ''; }).filter(Boolean);
}
function coopArena(C) {
  const ch = C.ch, live = C.phase === 'play', hide = C.phase === 'intro';
  const flash = ch.flash && live ? `<p class="flash ${ch.flash.ok ? 'ok' : 'bad'}">${esc(ch.flash.text)}</p>` : '';
  const pane = (side, head, body) => `<section class="pane p${side}"><div class="ph"><span>${pfirst(C.players[side])}</span><span class="role">${head}</span></div>${hide ? '<div class="waiting">Get ready…</div>' : body}</section>`;
  if (ch.type === 'sort') {
    const clue = ch.items[Math.min(ch.k, ch.items.length - 1)];
    const bins = side => coopButtons(ch.own[side].map(id => ({text:BOOKS[id].title, color:BOOKS[id].color, state:'bin', disabled:!live})), side);
    return `<section class="prompt center">${hide ? '<p class="ptext">🗂️ Book Sort</p>' : `<div class="tags"><span class="tag">${esc(clue.tag)}</span><span class="tag">Clue ${Math.min(ch.k + 1, ch.items.length)} / ${ch.items.length}</span></div><p class="ptext">${esc(clue.text)}</p>`}${flash}</section>
      ${pane(0, '🛡️ Your books', bins(0))}${pane(1, '🛡️ Your books', bins(1))}`;
  }
  if (ch.type === 'match') {
    const st = (side, i, it) => ch.matched.includes(it.id) ? 'right' : ch.sel[side] === i ? 'picked' : '';
    const L = coopButtons(ch.left.map((it, i) => ({html:`${it.emoji} ${esc(it.name)}`, state:st(0, i, it), disabled:!live || ch.matched.includes(it.id)})), 0);
    const R = coopButtons(ch.right.map((it, i) => ({text:it.desc, state:st(1, i, it) + ' desc', disabled:!live || ch.matched.includes(it.id)})), 1);
    return `<section class="prompt center"><p class="ptext small">🧩 Match every name to its description: ${ch.matched.length} / ${ch.left.length}</p><p class="muted" style="margin:4px 0 0">Books: ${ch.books.map(id => esc(BOOKS[id].title)).join(' + ')}</p>${flash}</section>
      ${pane(0, '🏷️ Names', L)}${pane(1, '📝 Descriptions', R)}`;
  }
  if (ch.type === 'timeline') {
    const n = ch.src.events.length;
    const slots = ch.src.events.map((e, i) => `<li class="${i < ch.next ? 'on' : ''}"><span>${i + 1}</span>${i < ch.next ? esc(e) : '…'}</li>`).join('');
    const hand = side => coopButtons(ch.hands[side].map(c => ({text:c.t, state:c.used ? 'right' : '', disabled:!live || c.used})), side);
    return `<section class="prompt center"><p class="ptext small">🕰️ ${esc(ch.src.title)}</p>${hide ? '' : `<ol class="tl">${slots}</ol>`}${flash}</section>
      ${pane(0, `🃏 Your cards`, hand(0))}${pane(1, `🃏 Your cards`, hand(1))}`;
  }
  // crossed wires
  const side = s => {
    const q = ch.qs[s], other = 1 - s, a = ch.ans[other];
    const cs = ch.choices[other].map((c, i) => ({text:c.text, state:a == null ? '' : c.correct ? 'right' : a === i ? 'wrong' : '', disabled:!live || a != null}));
    return `<div class="readbox"><small>📣 Read this out loud to ${pfirst(C.players[other])}:</small>${q.type === 'in_which_book' ? '' : bookTag(q.book)}<b>${esc(q.prompt)}</b></div>
      <small class="muted">🎯 Your buttons answer ${pfirst(C.players[other])}'s question:</small>${coopButtons(cs, s)}`;
  };
  return `<section class="prompt center"><p class="ptext small">📡 Crossed Wires: your question's answers are on your teammate's side!</p>${flash}</section>
    ${pane(0, '📡 Talk + tap', side(0))}${pane(1, '📡 Talk + tap', side(1))}`;
}

      crossed:() => `You each get a question, but its answer buttons are on your teammate's side. Read your question out loud, then answer your teammate's. ${Math.round(ch.total / 1000)} seconds.`,
    }[ch.type]();
    overlay = `<div class="overlay"><div class="fb intro"><div class="fb-head">${T.icon} Round ${C.round}: ${T.title}</div><p>${how}</p>
      <div class="actions center"><button class="btn primary big" data-act="coopGo" data-enter>Ready. Go!</button></div></div></div>`;
  } else if (C.phase === 'result') {

function qEditor(q, origin) {

  return `<h2>Edit ${esc(q.id)}</h2><form data-form="saveQ" data-id="${esc(q.id)}" data-origin="${origin}">
    <div class="field"><label>Question</label><textarea name="prompt" required>${esc(q.prompt)}</textarea></div>
    ${iwb ? `<p class="muted">Answer: ${esc(bookLabel(q.book))}. Choices come from the other books in the Battle.</p>` : `
    <div class="field"><label>Answer</label><input name="answer" value="${esc(q.answer)}" required></div>
    <div class="grid3">${[0, 1, 2].map(i => `<div class="field"><label>Wrong answer ${i + 1}</label><input name="d${i}" value="${esc((q.distractors || [])[i] || '')}"></div>`).join('')}</div>
    <div class="field"><label>Also accept (one per line, for typed answers)</label><textarea name="acceptAlso">${lines(q.acceptAlso)}</textarea></div>
    ${isOrder(q) ? `<div class="field"><label>Correct order (one event per line)</label><textarea name="order">${lines(q.order)}</textarea></div>` : ''}`}
    <div class="field"><label>Hint</label><input name="hint" value="${esc(q.hint || '')}"></div>
    <div class="field"><label>Why it's right</label><textarea name="explanation">${esc(q.explanation || '')}</textarea></div>
    <div class="grid3"><div class="field"><label>Difficulty</label><select name="difficulty">${[1, 2, 3].map(d => `<option ${+q.difficulty === d ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
      <div class="field"><label>Source note</label><input name="source" value="${esc(q.source || '')}"></div>
      <label class="field" style="justify-content:flex-end"><span><input type="checkbox" name="verified" ${q.verified ? 'checked' : ''} style="width:22px;height:22px;vertical-align:middle"> <b>Verified</b></span></label></div>
    <div class="actions">${origin === 'kid' ? `<button type="button" class="btn bad" data-act="delKid" data-id="${esc(q.id)}">Delete</button>` : S.edits[q.id] ? `<button type="button" class="btn" data-act="revertQ" data-id="${esc(q.id)}">Revert to original</button>` : ''}
      <button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary">Save</button></div></form>`;
}
function setBankFields(id, fields) {
  const orig = RAW_BY_ID[id], e = {...(S.edits[id] || {})};
  for (const [k, v] of Object.entries(fields)) { if (JSON.stringify(orig[k]) === JSON.stringify(v) || (orig[k] === undefined && (v === '' || (Array.isArray(v) && !v.length)))) delete e[k]; else e[k] = v; }
  if (Object.keys(e).length) S.edits[id] = e; else delete S.edits[id];
}
function exportContent() {
  const qs = (RAW.questions || []).map(q => ({...q, ...(S.edits[q.id] || {})}));
  const kids = S.kidQs.map(q => ({...q}));
  download(`battle-content-${today()}.json`, {...RAW, questions:qs.concat(kids)});
}

const FORMS = {
  quizIwb: fd => {

  writeQ: (fd, form) => {
    const book = fd.get('book'), type = fd.get('type'), prompt = fd.get('prompt').trim(), iwb = type === 'in_which_book';

    if (!prompt || !answer) return toast('Please write the question and the correct answer.');

    S.kidQs.push({id:'kid-' + uid(), book, type, prompt, answer, distractors, hint:fd.get('hint').trim(), explanation:fd.get('explanation').trim(),
      difficulty:2, verified:false, confidence:'kid', source:`Written by ${meName()} on ${today()}`, author:meName()});

  },
  saveTeam: fd => {

  },
  saveQ: (fd, form) => {

    const out = {};
    for (const [k, v] of fd.entries()) { const [a, b] = k.split('.'); out[a] ||= {}; out[a][b] = v === 'on' ? true : (isNaN(+v) || v === '' ? v : +v); }
    out.content = {...(out.content || {}), onlyVerified:fd.get('content.onlyVerified') === 'on', includeKidQuestions:fd.get('content.includeKidQuestions') === 'on'};
    S.settings = out; save(); render(); toast('Settings saved ✅');
  },
};

// ---------- event wiring ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && INP[el.dataset.input]) INP[el.dataset.input](el, e); });
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault(); const f = FORMS[form.dataset.form]; if (f) f(new FormData(form), form);
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if ($('.modal')) { if (e.key === 'Escape') closeModal(); return; }
  const tag = e.target.tagName, typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (typing) return;
  if (tag === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;   // let the focused button handle it
  const k = e.key.toLowerCase();
  if (U.screen === 'coop' && U.coop && U.coop.phase === 'play') {
    for (const side of [0, 1]) { const i = COOP_KEYS[side].indexOf(k); if (i >= 0) { coopTap(side, i); e.preventDefault(); return; } }
  }
  if (U.screen === 'h2h' && U.h2h && !U.h2h.done) {
    const L = 'asdf'.indexOf(k), R = 'jkl;'.indexOf(k);
    if (L >= 0) { h2hPick(0, L); e.preventDefault(); return; }
    if (R >= 0) { h2hPick(1, R); e.preventDefault(); return; }
  }
  if (/^[1-9]$/.test(k)) { const b = app.querySelector(`[data-key="${k}"]:not(:disabled)`); if (b) { b.click(); e.preventDefault(); } }
  else if (k === 'enter') { const b = $('.overlay [data-enter]') || app.querySelector('[data-enter]:not(:disabled)'); if (b) { b.click(); e.preventDefault(); } }
  else if (U.screen === 'flash' && U.fc && (k === ' ' || k === 'arrowright' || k === 'arrowleft' || k === 'm')) {
    ({' ':ACT.fcFlip, arrowright:ACT.fcNext, arrowleft:ACT.fcPrev, m:() => { if (U.fc.flipped) ACT.fcMast(); }})[k](); e.preventDefault();
  }
});

render();
if (!profile().named) setTimeout(() => openModal(playerEditor('me')), 400);
else if (!S.teamAsked) setTimeout(() => openModal(teamEditor()), 400);
</script>
</body>
